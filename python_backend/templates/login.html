<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login &amp; Sign Up — BankQueue</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Theme CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at 50% 10%, #1e293b 0%, #0f172a 70%, #020617 100%);
            color: #ffffff;
        }
        .auth-card {
            background: #ffffff;
            color: #0f172a;
            border-radius: 18px;
            padding: 2.25rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-tabs-auth .nav-link {
            color: #64748b;
            font-weight: 600;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 16px;
        }
        .nav-tabs-auth .nav-link.active {
            color: #0284c7;
            border-bottom: 2px solid #0284c7;
            background: transparent;
        }
        .error-alert {
            display: none;
            font-size: 0.875rem;
        }
    </style>
    <script>
        // If already logged in, seamlessly forward to the home dashboard
        if (localStorage.getItem("bank_token")) {
            window.location.replace("/home");
        }
    </script>
</head>
<body class="login-wrapper">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-decoration-none" href="/">
                <span class="brand-badge"><i class="bi bi-bank2"></i>BankQueue</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <span class="text-secondary small d-none d-sm-inline"><i class="bi bi-shield-lock-fill text-success me-1"></i>Secure Bank Portal</span>
            </div>
        </div>
    </nav>

    <!-- Main Auth Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">

                <!-- Auth Card -->
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <span class="brand-badge mb-2"><i class="bi bi-bank2"></i>BankQueue</span>
                        <h4 class="fw-bold mt-2 mb-1" id="authTitle">Sign In to Your Account</h4>
                        <p class="text-muted small" id="authSubtitle">Please sign in or register to access the Bank Queue System and book tokens from home.</p>
                    </div>

                    <!-- Tabs: Login vs Register -->
                    <ul class="nav nav-tabs nav-tabs-auth nav-fill mb-4" id="authTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="tab-login" data-bs-toggle="tab" data-bs-target="#pane-login" type="button" onclick="switchAuthTab('login')">Sign In</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="tab-register" data-bs-toggle="tab" data-bs-target="#pane-register" type="button" onclick="switchAuthTab('register')">Sign Up</button>
                        </li>
                    </ul>

                    <!-- Inline Alert Box -->
                    <div id="authAlert" class="alert alert-danger error-alert py-2 mb-3" role="alert"></div>

                    <div class="tab-content" id="authTabContent">
                        
                        <!-- 1. SIGN IN PANE -->
                        <div class="tab-pane fade show active" id="pane-login">
                            <form id="formLogin" onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-navy">Email Address *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter your registered email" required autocomplete="email">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-navy">Password *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                        <input type="password" id="loginPass" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                                    </div>
                                </div>
                                <div class="d-grid mb-3">
                                    <button type="submit" id="btnLoginSubmit" class="btn btn-bank-primary py-2 fw-bold">Sign In &amp; Continue</button>
                                </div>
                                <div class="text-center small text-muted">
                                    Don't have an account? <a href="#" class="text-primary text-decoration-none fw-semibold" onclick="switchAuthTab('register')">Sign Up here</a>
                                </div>
                            </form>
                        </div>

                        <!-- 2. SIGN UP PANE -->
                        <div class="tab-pane fade" id="pane-register">
                            <form id="formRegister" onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-navy">Full Name *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                        <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required autocomplete="name">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-navy">Email Address *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="regEmail" class="form-control" placeholder="Enter your email address" required autocomplete="email">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-navy">Password *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                        <input type="password" id="regPass" class="form-control" placeholder="Create password (min 6 characters)" required minlength="6" autocomplete="new-password">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold text-navy">Confirm Password *</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                                        <input type="password" id="regConfirmPass" class="form-control" placeholder="Re-enter password to confirm" required minlength="6" autocomplete="new-password">
                                    </div>
                                </div>
                                <div class="d-grid mb-3">
                                    <button type="submit" id="btnRegSubmit" class="btn btn-bank-primary py-2 fw-bold">Sign Up &amp; Create Account</button>
                                </div>
                                <div class="text-center small text-muted">
                                    Already have an account? <a href="#" class="text-primary text-decoration-none fw-semibold" onclick="switchAuthTab('login')">Sign In here</a>
                                </div>
                            </form>
                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center py-3 text-secondary small">
        &copy; 2026 BankQueue System &bull; Secure Bank Queue Management &amp; Digital Tokens
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const BACKEND_URL = window.BACKEND_URL || window.location.origin;

        function showError(msg) {
            const alertBox = document.getElementById("authAlert");
            if (alertBox) {
                alertBox.textContent = msg;
                alertBox.style.display = "block";
            }
        }

        function clearError() {
            const alertBox = document.getElementById("authAlert");
            if (alertBox) {
                alertBox.textContent = "";
                alertBox.style.display = "none";
            }
        }

        function switchAuthTab(target) {
            clearError();
            if (target === "register") {
                const regTab = document.getElementById("tab-register");
                if (regTab) bootstrap.Tab.getOrCreateInstance(regTab).show();
                document.getElementById("authTitle").textContent = "Create New Account";
                document.getElementById("authSubtitle").textContent = "Sign up to request bank tokens from home within the next 2 days.";
            } else {
                const logTab = document.getElementById("tab-login");
                if (logTab) bootstrap.Tab.getOrCreateInstance(logTab).show();
                document.getElementById("authTitle").textContent = "Sign In to Your Account";
                document.getElementById("authSubtitle").textContent = "Please sign in to access the Bank Queue System and book tokens.";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            clearError();
            const email = document.getElementById("loginEmail").value.trim();
            const pass = document.getElementById("loginPass").value;

            if (!email) {
                showError("Please enter your email address.");
                return;
            }
            if (!pass) {
                showError("Please enter your password.");
                return;
            }

            const btn = document.getElementById("btnLoginSubmit");
            if (btn) btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/v1/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: pass })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || "Invalid email or password.");
                }

                const data = await res.json();
                localStorage.setItem("bank_token", data.access_token);
                localStorage.setItem("bank_user", JSON.stringify(data.user));

                // Immediately redirect to the Home Dashboard
                window.location.replace("/home");
            } catch (err) {
                showError(err.message);
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearError();
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const pass = document.getElementById("regPass").value;
            const confirmPass = document.getElementById("regConfirmPass").value;

            if (name.length < 2) {
                showError("Please enter your full name.");
                return;
            }
            if (!email || !email.includes("@") || !email.includes(".")) {
                showError("Please enter a valid email address.");
                return;
            }
            if (pass.length < 6) {
                showError("Password must be at least 6 characters long.");
                return;
            }
            if (pass !== confirmPass) {
                showError("Passwords do not match. Please re-enter your password.");
                return;
            }

            const btn = document.getElementById("btnRegSubmit");
            if (btn) btn.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/api/v1/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        full_name: name,
                        email: email,
                        password: pass,
                        confirm_password: confirmPass
                    })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || "Registration failed. Please try again.");
                }

                const data = await res.json();
                localStorage.setItem("bank_token", data.access_token);
                localStorage.setItem("bank_user", JSON.stringify(data.user));

                // Immediately redirect to the Home Dashboard
                window.location.replace("/home");
            } catch (err) {
                showError(err.message);
            } finally {
                if (btn) btn.disabled = false;
            }
        }
    </script>
</body>
</html>
