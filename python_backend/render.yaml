services:
  - type: web
    name: bank-queue-management-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ALLOWED_ORIGINS
        value: "https://queue-wiz-home.lovable.app"
